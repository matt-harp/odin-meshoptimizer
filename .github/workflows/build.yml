name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Serialize runs so two pushes can't commit/push on top of each other concurrently.
concurrency:
  group: build-and-commit
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build meshoptimizer (Windows)
        shell: pwsh
        run: ./build.ps1

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile and run canary (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          odin build tests/canary.odin -file -collection:meshopt=. -out:build/canary.exe
          & .\build\canary.exe

      - uses: actions/upload-artifact@v4
        with:
          name: meshoptimizer-windows
          path: meshoptimizer.lib

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build meshoptimizer (Linux)
        run: bash ./build.sh

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile and run canary (Linux)
        run: |
          set -euo pipefail
          mkdir -p build
          odin build tests/canary.odin -file -collection:meshopt=. -out:build/canary
          ./build/canary

      - uses: actions/upload-artifact@v4
        with:
          name: meshoptimizer-linux
          path: libmeshoptimizer.a

  commit:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows library
        uses: actions/download-artifact@v4
        with:
          name: meshoptimizer-windows
          path: artifacts

      - name: Download Linux library
        uses: actions/download-artifact@v4
        with:
          name: meshoptimizer-linux
          path: artifacts

      - name: Commit and push libraries
        run: |
          set -euo pipefail
          cp artifacts/meshoptimizer.lib meshoptimizer.lib
          cp artifacts/libmeshoptimizer.a libmeshoptimizer.a

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meshoptimizer.lib libmeshoptimizer.a

          if git diff --cached --quiet; then
            echo "Library files are unchanged; nothing to commit."
          else
            git commit -m "build: refresh meshoptimizer libraries [skip ci]"
            git push
          fi
